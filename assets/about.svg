<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Hey, I'm Sagar. CS student getting deep into AI/ML. I love writing code, picking up new tools, and building things that are a bit more fun than they need to be. Right now I'm sharpening my coding and ML/DL fundamentals and making cool stuff along the way. I speak C, C++, Python, JS, TS and Go."><defs><filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
