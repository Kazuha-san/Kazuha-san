0000;0.1813;0.1906;0.9375;0.9625;1.0000" dur="16s" repeatCount="indefinite"/>that are a bit more fun than they need to be.</text><text x="36" y="192" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#cfe9ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2313;0.2406;0.9375;0.9625;1.0000" dur="16s" repeatCount="indefinite"/>right now i'm sharpening my coding + ML/DL fundamentals,</text><text x="36" y="220" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#cfe9ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2812;0.2906;0.9375;0.9625;1.0000" dur="16s" repeatCount="indefinite"/>and making cool stuff along the way.</text><text x="36" y="248" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#cfe9ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3313;0.3406;0.9375;0.9625;1.0000" dur="16s" repeatCount="indefinite"/>i speak <tspan fill="#00f0ff">C, C++, Python, JS, TS</tspan> and <tspan fill="#00f0ff">Go</tspan> (some more fluently than others).</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3813;0.3844;0.9375;0.9625;1.0000" dur="16s" repeatCount="indefinite"/><text x="36" y="276" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#00f0ff">$</text><rect x="54" y="263" width="9" height="17" fill="#ff2bd6"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1s" repeatCount="indefinite"/></rect></g><rect width="900" height="310" fill="url(#scan)"/></g><rect x="1.5" y="1.5" width="897" height="307" rx="13" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"><animate attributeName="stroke-opacity" values="1;1;.35;1;.6;1;1" keyTimes="0;.5;.52;.55;.58;.6;1" dur="7s" repeatCount="indefinite"/></rect></svg>